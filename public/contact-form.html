<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Contact form registration</title></head>
  <body>
    <form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto" />
      <input name="name" />
      <input name="email" type="email" />
      <select name="session"><option value="Portrait">Portrait</option></select>
      <input name="date" type="date" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
